# Where the kernel's memory ports go on the U55C (16 GB HBM in 32 pseudo-channels of 512 MB). First version: the weights
# (86 MB) on one pseudo-channel through port gmem0; everything else (small tables, tokens, the check dump) through
# gmem1 on another. The tuned version will spread the weights over many channels and ports.
[connectivity]
nk=lif_lm:1:lif_lm_1
sp=lif_lm_1.w:HBM[0]
sp=lif_lm_1.prm:HBM[1]
sp=lif_lm_1.aux:HBM[1]
sp=lif_lm_1.tok_in:HBM[1]
sp=lif_lm_1.tok_out:HBM[1]
sp=lif_lm_1.dump:HBM[1]
